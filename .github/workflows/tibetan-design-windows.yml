name: Tibetan Design Photo Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release notification catalogs
        run: python scripts/check-update-catalogs.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve new update-check dependencies
        run: cargo update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: Resolved-lock-Windows
          path: Cargo.lock
          if-no-files-found: error
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install -g wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Check Tibetan translations
        shell: pwsh
        run: |
          ./scripts/prepare-tibetan-font.ps1
          cargo test -p photocraft-ui-egui --lib i18n:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p photocraft-ui-egui --lib updates:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p photocraft-ui-egui --lib bilingual_language_menu --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p photocraft-ui-egui --lib brand:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p photocraft --bin photocraft updates:: --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer and portable archive
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Design-Windows
          path: |
            dist/release/tibetan-design-*-windows-x64.msi
            dist/release/tibetan-design-*-windows-x64-portable.zip
