name: Publish Tibetan Design 0.8.2
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-tibetan-design-0.8.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify successful source builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/38504065592 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/38504065592 --jq .head_sha)" = 8e3c0ca37caa3cf3165b88fdd135d471db9e1d5d
          test "$(gh api repos/$GH_REPO/actions/runs/38755426758 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/38755426758 --jq .head_sha)" = 5c67fb7f63c4131d88bf7275238e298b99cb85cb
      - uses: actions/download-artifact@v4
        with:
          name: Tibetan-Design-Windows
          github-token: ${{ github.token }}
          run-id: 38504065592
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: Tibetan-Design-macOS-aarch64
          github-token: ${{ github.token }}
          run-id: 38755426758
          path: artifacts/mac-arm
      - uses: actions/download-artifact@v4
        with:
          name: Tibetan-Design-macOS-x86_64
          github-token: ${{ github.token }}
          run-id: 38755426758
          path: artifacts/mac-intel
      - name: Verify and publish installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for name in tibetan-design-0.8.2-windows-x64.msi tibetan-design-0.8.2-windows-x64-portable.zip tibetan-design-0.8.2-macos-aarch64.dmg tibetan-design-0.8.2-macos-x86_64.dmg; do
            mapfile -t matches < <(find artifacts -type f -name "$name")
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "release-assets/$name"
          done
          cd release-assets
          cat > SHA256SUMS.txt <<'CHECKSUMS'
          504be3e9c38397531fbce7c548a23b9330ee7c104e59a2c353d9608309bcc865  tibetan-design-0.8.2-macos-aarch64.dmg
          e51925a59cb22347b44a4d9102d3be92af549a5b70e0ea441213b6751b9f2dea  tibetan-design-0.8.2-macos-x86_64.dmg
          f5dac72f7a73545548f6ffcc1a36096413e143131b38ba84d16731c55696d166  tibetan-design-0.8.2-windows-x64-portable.zip
          6bbc88d5da0071c0e74b4c37abcefe76d86c481043dae257febddd991a686f74  tibetan-design-0.8.2-windows-x64.msi
          CHECKSUMS
          sha256sum -c SHA256SUMS.txt
          test "$(gh release view v0.8.2 --json isDraft --jq .isDraft)" = true
          gh release upload v0.8.2 *.msi *.dmg *.zip SHA256SUMS.txt
          gh release edit v0.8.2 --target 5c67fb7f63c4131d88bf7275238e298b99cb85cb --draft=false --latest
          gh release view v0.8.2 --json url,assets,isDraft > "$GITHUB_WORKSPACE/published-release.json"
          test "$(gh release view v0.8.2 --json isDraft --jq .isDraft)" = false
          echo 'Published Windows and both Mac packages to https://github.com/tibetanebook-cloud/tibetan-design/releases/tag/v0.8.2' >> "$GITHUB_STEP_SUMMARY"
