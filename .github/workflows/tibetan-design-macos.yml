name: Tibetan Design Photo macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      # Keep release optimization while limiting memory on standard Mac runners.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Validate release notification catalogs
        run: python3 scripts/check-update-catalogs.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve new update-check dependencies
        run: cargo update --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: Resolved-lock-macOS-${{ matrix.arch }}
          path: Cargo.lock
          if-no-files-found: error
      - name: Prepare Tibetan font
        run: |
          source scripts/prepare-tibetan-font.sh
          echo "TIBETAN_UI_FONT=$TIBETAN_UI_FONT" >> "$GITHUB_ENV"
      - name: Validate Mac packaging inputs
        run: |
          bash -n packaging/macos/package.sh packaging/macos/verify.sh scripts/prepare-tibetan-font.sh
          python3 packaging/macos/test_tibetan_package.py
      - name: Check Tibetan translations and font coverage
        run: |
          cargo test -p photocraft-ui-egui --lib i18n:: --locked
          cargo test -p photocraft-ui-egui --lib egui_fonts::tests::optional_tibetan_face_covers_the_catalog --locked
          cargo test -p photocraft-ui-egui --lib font_preview::tests::prepared_tibetan_face_renders_a_real_tibetan_sample --locked
      - name: Check language switch and release notifications
        run: |
          cargo test -p photocraft-ui-egui --lib updates:: --locked
          cargo test -p photocraft-ui-egui --lib bilingual_language_menu --locked
          cargo test -p photocraft-ui-egui --lib brand:: --locked
          cargo test -p photocraft --bin photocraft updates:: --locked
      - name: Check native Mac menus
        run: cargo test -p photocraft --test mac_menu_appkit --locked
      - name: Import optional Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash packaging/macos/import-cert.sh
      - name: Build Tibetan Design Photo DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos/package.sh --arch '${{ matrix.arch }}'
      - name: Verify downloadable packages
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos/verify.sh --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Tibetan-Design-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/release/tibetan-design-*-macos-${{ matrix.arch }}.dmg
            dist/release/tibetan-design-cli-*-macos-${{ matrix.arch }}.zip
